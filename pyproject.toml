[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamval"
version = "0.1.0"
description = "Pydantic-compatible streaming data validator for CSV, JSONL, Parquet, and Arrow"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["validation", "streaming", "pydantic", "csv", "parquet", "jsonl", "data-quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "pydantic>=2.7,<3.0",
  "pyarrow>=16.0,<20.0",
  "aiofiles>=23.2,<25.0",
]

[project.optional-dependencies]
fast = [
  "orjson>=3.10,<4.0",
  "polars>=0.20,<2.0",
]
http = [
  "httpx>=0.27,<1.0",
]
dev = [
  "pytest>=8.1",
  "pytest-asyncio>=0.23",
  "pytest-benchmark>=4.0",
  "pytest-httpx>=0.30",
  "httpx>=0.27,<1.0",
  "mypy>=1.10",
  "ruff>=0.4",
  "hatchling>=1.24",
]
docs = [
  "mkdocs-material>=9.0",
  "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/AmeerTechsoft/streamval"
Documentation = "https://github.com/AmeerTechsoft/streamval#readme"
Repository = "https://github.com/AmeerTechsoft/streamval"
Issues = "https://github.com/AmeerTechsoft/streamval/issues"
Changelog = "https://github.com/AmeerTechsoft/streamval/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["streamval"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"examples/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "aiofiles", "aiofiles.*", "orjson", "polars", "httpx", "httpx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
