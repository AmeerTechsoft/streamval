name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,fast,http]"

      - name: Lint (ruff)
        run: python -m ruff check streamval tests examples

      - name: Type-check (mypy --strict)
        run: python -m mypy streamval

      - name: Unit + integration tests
        run: python -m pytest tests/unit tests/integration -v --tb=short

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      # --strict turns warnings (broken internal links, missing nav
      # targets, mkdocstrings resolution failures) into errors. Nothing
      # else in CI builds the docs, so without this a page can 404 on the
      # published site with every check still green.
      - name: Build docs (mkdocs --strict)
        run: python -m mkdocs build --strict

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,fast,http]"
      - name: Run benchmarks (observability, no floor assertions)
        env:
          STREAMVAL_BENCH: "1"
          STREAMVAL_MAX_MB: "50"
        run: python -m pytest tests/benchmarks -v -s
