name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Verify tag matches package version
        run: |
          set -eux
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import re, pathlib; print(re.search(r'^version = \"(.*?)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")
          if [ "$TAG" != "$PKG" ] && ! echo "$TAG" | grep -qE "^${PKG}(rc|a|b)[0-9]+$"; then
            echo "Tag $TAG does not match pyproject.toml version $PKG"
            exit 1
          fi

      - name: Build distributions
        run: python -m build

      - name: Check metadata with twine
        run: python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: contains(github.ref_name, 'rc') || contains(github.ref_name, 'a') || contains(github.ref_name, 'b')
    environment:
      name: testpypi
      url: https://test.pypi.org/p/streamval
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: "!(contains(github.ref_name, 'rc') || contains(github.ref_name, 'a') || contains(github.ref_name, 'b'))"
    environment:
      name: pypi
      url: https://pypi.org/p/streamval
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: "!(contains(github.ref_name, 'rc') || contains(github.ref_name, 'a') || contains(github.ref_name, 'b'))"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          set -eux
          TAG="${GITHUB_REF_NAME#v}"
          python - <<'PY' > release_notes.md
          import pathlib, re, os
          tag = os.environ['GITHUB_REF_NAME'].lstrip('v')
          text = pathlib.Path('CHANGELOG.md').read_text()
          pattern = re.compile(rf"^##\s*\[{re.escape(tag)}\].*?$(.*?)(?=^##\s*\[|\Z)", re.M | re.S)
          m = pattern.search(text)
          print(m.group(1).strip() if m else f"Release {tag}.")
          PY
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: dist/*
          fail_on_unmatched_files: true
